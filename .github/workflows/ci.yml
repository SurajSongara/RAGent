name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # API compatibility tests now import application modules as well as
      # pure ingest primitives. Use the package's declared dependencies.
      - name: Install application and test tools
        run: python -m pip install -e ".[dev]" ruff==0.15.20 pytest==8.3.4 pytest-asyncio==0.24.0

      - name: Lint
        run: ruff check ragent tests

      - name: Format check
        run: ruff format --check ragent tests

      - name: Test
        run: pytest -q
