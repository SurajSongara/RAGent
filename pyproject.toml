[project]
name = "ragent"
version = "0.1.0"
description = "Document intelligence over SEC filings: async ingest, hybrid retrieval, bbox-grounded citations, MCP both ways."
requires-python = ">=3.12"

dependencies = [
    # Only what is actually imported. Heavier libraries arrive with the stage
    # that needs them — docling and rapidocr with layout analysis and OCR,
    # langgraph and mcp with the agent plane, opentelemetry with tracing.
    # Declaring them early would put minutes of onnxruntime build into every
    # `make install` for code that does not exist yet.

    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    # Required by FastAPI for the multipart upload endpoint.
    "python-multipart>=0.0.20",

    # storage
    "asyncpg>=0.30",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "aio-pika>=9.5",
    "aioboto3>=13.2",

    # ingest
    "pypdfium2>=4.30",

    # models
    "anthropic>=0.40",
    "fastembed>=0.5",
    "voyageai>=0.3",

    # seeding and health checks
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.9",
    "watchfiles>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# B008 flags FastAPI's Depends/File defaults, which are the framework's
# intended idiom rather than a mutable-default bug.
"ragent/api/*.py" = ["B008"]
# OOXML namespace URIs are fixed-length constants; wrapping them would make
# the fixture harder to verify against the spec, not easier to read.
"scripts/seed_edgar.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Explicit, because auto-discovery gives up when the repo root holds several
# top-level directories (ragent, scripts, evals, tests, web).
[tool.setuptools.packages.find]
include = ["ragent*", "scripts*", "evals*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
