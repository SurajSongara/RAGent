[project]
name = "ragent"
version = "0.1.0"
description = "Document intelligence over SEC filings: async ingest, hybrid retrieval, bbox-grounded citations, MCP both ways."
requires-python = ">=3.12"

dependencies = [
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",

    # storage
    "asyncpg>=0.30",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "aio-pika>=9.5",
    "aioboto3>=13.2",

    # ingest
    "docling>=2.14",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.4",
    "pillow>=11.0",

    # models
    "anthropic>=0.40",
    "fastembed>=0.5",
    "voyageai>=0.3",
    "tiktoken>=0.8",

    # agent
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.2",

    # observability
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# B008 flags FastAPI's Depends/File defaults, which are the framework's
# intended idiom rather than a mutable-default bug.
"ragent/api/*.py" = ["B008"]
# OOXML namespace URIs are fixed-length constants; wrapping them would make
# the fixture harder to verify against the spec, not easier to read.
"scripts/seed_edgar.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
