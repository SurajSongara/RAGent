name: ragent

# One-command bring-up is a hard requirement: if a reviewer cannot get this
# running in two minutes it does not exist to them. Every service here has a
# healthcheck so `make up` blocks until the stack is actually usable.

x-python-env: &python-env
  DATABASE_URL: postgresql+asyncpg://ragent:ragent@postgres:5432/ragent
  QDRANT_URL: http://qdrant:6333
  VALKEY_URL: redis://valkey:6379/0
  RABBITMQ_URL: amqp://ragent:ragent@rabbitmq:5672/
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ragent
  S3_SECRET_KEY: ragentragent
  S3_BUCKET: ragent
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ragent
      POSTGRES_PASSWORD: ragent
      POSTGRES_DB: ragent
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragent -d ragent"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # qdrant images ship no curl/wget; use the bundled TCP check instead
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ragent
      RABBITMQ_DEFAULT_PASS: ragent
    ports: ["5672:5672", "15672:15672"]   # 15672 = management UI, worth showing in a demo
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragent
      MINIO_ROOT_PASSWORD: ragentragent
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket then exits. Keeps bucket setup out of app startup so the
  # API and workers stay stateless about infrastructure provisioning.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ragent ragentragent &&
             mc mb --ignore-existing local/ragent &&
             mc anonymous set download local/ragent/pages"
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.65
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317"]

  api:
    build: {context: ., dockerfile: infra/Dockerfile.python}
    command: uvicorn ragent.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *python-env
    ports: ["8000:8000"]
    volumes: ["./ragent:/app/ragent", "./evals:/app/evals"]
    depends_on:
      postgres:  {condition: service_healthy}
      qdrant:    {condition: service_healthy}
      valkey:    {condition: service_healthy}
      rabbitmq:  {condition: service_healthy}
      minio:     {condition: service_healthy}

  # Split by workload rather than one generic pool: parsing/OCR is CPU-bound and
  # slow, embedding is batch-friendly, and the LLM stages are latency-bound and
  # rate-limited. They scale on different axes, so they get different consumers.
  worker-parse:
    build: {context: ., dockerfile: infra/Dockerfile.python}
    command: python -m ragent.workers.run --queues parse,ocr,tables --concurrency 2
    environment: *python-env
    volumes: ["./ragent:/app/ragent"]
    depends_on:
      api: {condition: service_started}
    deploy:
      replicas: 2

  worker-enrich:
    build: {context: ., dockerfile: infra/Dockerfile.python}
    command: python -m ragent.workers.run --queues figures,chunk,contextualize,embed --concurrency 4
    environment: *python-env
    volumes: ["./ragent:/app/ragent"]
    depends_on:
      api: {condition: service_started}

  web:
    build: {context: ./web, dockerfile: Dockerfile}
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    volumes: ["./web:/app", "/app/node_modules"]
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
  qdrant_storage:
  valkey_data:
  rabbitmq_data:
  minio_data:
